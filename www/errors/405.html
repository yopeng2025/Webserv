<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>405</title>

<style>
:root {
	--bg: #faf9fc;
	--surface: #ffffff;
	--surface-2: #f1eff8;
	--border: #e0dcee;
	--text: #3a3554;
	--text-dim: #8b86a3;
	--accent: #7263e0;
	--accent-glow: rgba(114, 99, 224, 0.12);
	--success: #2fa984;
	--danger: #e17055;
	--warn: #bd8a1f;
	--radius: 12px;
	--mono: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html,
body {
    width: 100%;
    min-height: 100vh;
}

.error-page {
    min-height: 100vh;

    display: flex;
    justify-content: center;
    align-items: center;

    background: var(--bg);
}


.error-card {
    width: 360px;

    padding: 40px;

    text-align: center;

    background: var(--surface);

    border: 1px solid var(--border);

    border-radius: var(--radius);

    box-shadow: 0 8px 24px var(--accent-glow);
}


.error-code {
    margin-bottom: 20px;

    font-family: var(--mono);

    font-size: 72px;

    font-weight: 700;

    line-height: 1;

    color: var(--accent);
}


.error-card h1 {
    margin-bottom: 12px;

    font-size: 24px;

    font-weight: 600;

    color: var(--text);
}


.error-card p {
    margin-bottom: 28px;

    font-size: 15px;

    color: var(--text-dim);
}


.back-btn {
    display: inline-block;

    padding: 10px 22px;

    background: var(--accent);

    color: #fff;

    border-radius: var(--radius);

    text-decoration: none;

    font-size: 14px;

    transition: opacity .2s ease;
}


.back-btn:hover {
    opacity: .85;
}
</style>

</head>

<body>
<div class="error-page">
    <div class="error-card">
        <div class="error-code">405</div>
        <h1>Method Not Allowed</h1>
        <p>Only GET, POST, DELETE are allowed</p>
        <a href="/" class="back-btn">Go Home</a>
    </div>
</div>

</body>
</html>
