server {
    listen 8080;
    server_name localhost;
    client_max_body_size 100; 


    location / {
        root www;
        methods GET;
        index index.html;
    }

    location /post_body {
        root www;
        methods POST;
    }

    location /cgi-bin {
        root cgi-bin;
        methods POST;
        cgi_ext .bla;
        cgi_path ./cgi-bin/cgi_test;
    }

    location /directory/ {
        root YoupiBanane;
        methods GET;
        index youpi.bad_extension;
        autoindex off;
    }
}