# Test with:
#   curl -X POST -H "Content-Type: plain/text" --data "BODY IS HERE" http://localhost:8080/upload
#   → should return 413 (body > 20 bytes)
#
#   curl -X POST -H "Content-Type: plain/text" --data "short" http://localhost:8080/upload
#   → should return 2xx (body <= 20 bytes)

server {
	listen 8080;
	server_name localhost;
	client_max_body_size 20;

	error_page 404 www/errors/404.html;
	error_page 413 www/errors/413.html;

	location / {
		root www;
		index index.html;
		methods GET;
	}

	location /upload {
		root www/upload;
		methods GET POST DELETE;
		autoindex on;
		upload_path www/upload;
	}
}
